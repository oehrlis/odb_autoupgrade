# ------------------------------------------------------------------------------
# Name.......: au_keystore.cfg
# Purpose....: Minimal AutoUpgrade config used exclusively by au_keystore.sh
#              to open the -patch -load_password console. Contains only the
#              global keys required by AutoUpgrade; no patch or home blocks.
# Usage......: Passed to au_run.sh as -config <path> -patch -load_password
# Notes......: - global.global_log_dir is required; defaults to AU_LOG_DIR.
#              - global.keystore is the wallet directory written by the console.
#                Rendered via envsubst in au_run.sh using AU_LOG_DIR / AU_KEYSTORE.
#              - No patch1.* keys: the keystore console does not patch anything.
#              - Do NOT add folder, download_folder, or target_home here;
#                those are download/deploy keys and are rejected by older JARs
#                (AU facts 9: FOLDER_DEPRECATED).
# Reference..: https://github.com/oehrlis/odb_autoupgrade
# License....: Apache License Version 2.0
# ------------------------------------------------------------------------------
global.global_log_dir=${AU_LOG_DIR}
global.keystore=${AU_KEYSTORE}
