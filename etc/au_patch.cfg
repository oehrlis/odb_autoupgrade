# OraDBA - Oracle Database Infrastructure and Security, 5630 Muri, Switzerland
# ------------------------------------------------------------------------------
# Name.......: au_patch.cfg
# Purpose....: Unified AutoUpgrade patch config template for all three modes:
#              download, create_home, and deploy.
#              Lines whose variable is empty after expansion are dropped by
#              au_render_cfg (each dropped key is named in the log).
#              global.keystore is rendered only for -mode download.
# Usage......: au_run.sh -config au_patch.cfg -patch -mode download
#              au_run.sh -config au_patch.cfg -patch -mode create_home
#              au_run.sh -config au_patch.cfg -patch -mode deploy
#              au_run.sh -config au_patch.cfg -patch -mode analyze
# Variables..: Set by au_run.sh / au_load_config, autoupgrade.env, or the caller.
#
# Required for download:
#   AU_PATCH            RECOMMENDED (default) or e.g. RU:19.32,OPATCH,OJVM,DPBP,MRP
#   AU_PLATFORM         LINUX.X64 (default)
#   AU_TARGET_VERSION   19 (default)
#   AU_DOWNLOAD_FOLDER  default: ${AUTOUPGRADE_BASE}/patches
#   AU_LOG_DIR          default: ${AUTOUPGRADE_BASE}/logs
#   AU_KEYSTORE         default: ${AUTOUPGRADE_BASE}/keystore (download only)
#   AU_GOLD_IMAGE       NO (default) | YES | AUTO | ALL
#
# Required for create_home:
#   AU_TARGET_HOME      new Oracle Home path (must not exist or be empty)
#   AU_SOURCE_HOME      existing Oracle Home (optional; supplies base/edition/groups)
#
# Required for deploy:
#   AU_SID              database instance name to patch
#   AU_SOURCE_HOME      current Oracle Home of the database
#   AU_TARGET_HOME      patched Oracle Home (created by create_home or deploy)
#
# Optional (dropped when empty):
#   AU_EDITION          Oracle edition (EE, SE2, ...) for create_home without source
#   AU_ORACLE_BASE      ORACLE_BASE for create_home without source
#   AU_INVENTORY_LOCATION  Oracle inventory directory
#   AU_INVENTORY_GROUP     Oracle inventory group
#   AU_GROUP_OSDBA      OS group for OSDBA
#   AU_GROUP_OSOPER     OS group for OSOPER
#   AU_GROUP_OSBACKUPDBA OS group for OSBACKUPDBA
#   AU_GROUP_OSDGDBA    OS group for OSDGDBA
#   AU_GROUP_OSKMDBA    OS group for OSKMDBA
#   AU_GROUP_OSRACDBA   OS group for OSRACDBA
#
# Notes......: - global.keystore is removed by au_render_cfg when mode != download.
#              - No customer-specific values: all settings come from variables.
#              - Use etc/autoupgrade.env or AUTOUPGRADE_ENV_FILE for site defaults.
# Reference..: AutoUpgrade 26.6 -patch -help, doc/design.md
# License....: Apache License Version 2.0
# ------------------------------------------------------------------------------

# Global section
global.global_log_dir=${AU_LOG_DIR}
global.keystore=${AU_KEYSTORE}

# Patch job (one job covers download, create_home, and deploy in a unified config)
patch1.platform=${AU_PLATFORM}
patch1.target_version=${AU_TARGET_VERSION}
patch1.download_folder=${AU_DOWNLOAD_FOLDER}
patch1.patch=${AU_PATCH}
patch1.gold_image=${AU_GOLD_IMAGE}

# Optional: existing source home (supplies base, edition, groups for create_home)
patch1.source_home=${AU_SOURCE_HOME}

# Optional: target home for create_home and deploy
patch1.target_home=${AU_TARGET_HOME}

# Optional: database instance for deploy
patch1.sid=${AU_SID}

# Optional: Oracle edition (for create_home without source_home)
patch1.home_settings.edition=${AU_EDITION}

# Optional: Oracle base (for create_home without source_home)
patch1.home_settings.oracle_base=${AU_ORACLE_BASE}

# Optional: Oracle inventory settings
patch1.home_settings.inventory_location=${AU_INVENTORY_LOCATION}
patch1.home_settings.inventory_group=${AU_INVENTORY_GROUP}

# Optional: OS DBA groups (inherited from source_home when set)
patch1.home_settings.osdba_group=${AU_GROUP_OSDBA}
patch1.home_settings.osoper_group=${AU_GROUP_OSOPER}
patch1.home_settings.osbackupdba_group=${AU_GROUP_OSBACKUPDBA}
patch1.home_settings.osdgdba_group=${AU_GROUP_OSDGDBA}
patch1.home_settings.oskmdba_group=${AU_GROUP_OSKMDBA}
patch1.home_settings.osracdba_group=${AU_GROUP_OSRACDBA}
